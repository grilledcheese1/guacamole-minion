name: scrape

# Runs the Python scraper against the hosted Turso database.
# On-demand only: the "Run scrape now" button in the app hits /api/trigger-scrape,
# which calls the GitHub REST API to dispatch this workflow.
on:
  workflow_dispatch:
    inputs:
      location:
        description: "Scope the search to this city/ZIP (blank = nationwide sweep)"
        required: false
        default: ""
      max_price:
        description: "Only search for listings under this price (blank = no cap)"
        required: false
        default: ""
      groups:
        description: "Comma-separated keyword groups to search (blank = all)"
        required: false
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape listings
        run: python apartments.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SCRAPE_LOCATION: ${{ inputs.location }}
          SCRAPE_MAX_PRICE: ${{ inputs.max_price }}
          SCRAPE_GROUPS: ${{ inputs.groups }}

      - name: Geocode new listings
        continue-on-error: true
        run: python scripts/backfill_geocode.py
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
